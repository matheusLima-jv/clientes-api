spring:
  application:
    name: clientes-api
  datasource:
    url: jdbc:h2:mem:clientesdb
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    locale: pt_BR
    locale-resolver: fixed

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
