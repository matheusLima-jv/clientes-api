spring:
  application:
    name: clientes-api
  datasource:
    url: jdbc:h2:mem:clientesdb
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    web:
      pageable:
        page-parameter: pagina
        size-parameter: tamanho
        max-page-size: 50